<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opening Momentum…</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
  .card { text-align: center; padding: 24px; }
  .bolt { font-size: 64px; }
  h1 { font-size: 22px; margin: 12px 0 6px; }
  p { margin: 0; opacity: .85; font-size: 14px; }
  a { color: #fff; }
  .spinner { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,.35); border-top-color: #fff;
             border-radius: 50%; margin: 18px auto 0; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="bolt">⚡</div>
  <h1>Opening Momentum…</h1>
  <p>Taking you to the live planner — it always has the newest version.</p>
  <div class="spinner"></div>
  <p style="margin-top:18px">Nothing happening? <a id="manualLink" href="https://quantum-shadow911.github.io/Planner/">Click here</a></p>
</div>
<script>
  var LIVE = 'https://quantum-shadow911.github.io/Planner/';
  document.getElementById('manualLink').href = LIVE;
  setTimeout(function () { window.location.replace(LIVE); }, 900);
</script>
</body>
</html>
