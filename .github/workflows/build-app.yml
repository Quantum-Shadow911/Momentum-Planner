name: Build Mac & Windows apps

on:
  push:
    branches: [vibe/productivity-planner-3356e7]
    paths: ['electron/**', '.github/workflows/build-app.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build dependencies
        working-directory: electron
        run: npm install --no-audit --no-fund

      - name: Build Momentum.app (universal)
        working-directory: electron
        run: npx electron-builder --publish never

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v2.4.13
          name: Momentum (v2.4.13) — Mac & Windows
          body: |
            **Momentum as a real desktop application — Mac (.app/.dmg) and Windows (.exe installer).**

            ## Mac install
            1. Download **Momentum-2.4.13-universal.dmg** (or the .zip)
            2. Open the downloaded file
            3. Drag **Momentum** into your **Applications** folder
            4. Open Momentum from Applications

            ## Windows install
            1. Download **Momentum-Setup-2.4.13.exe**
            2. Run it (if Windows SmartScreen shows "Windows protected your PC", click **More info** → **Run anyway** — the app is unsigned because it is free and open-source)
            3. Choose a folder and finish the installer — Momentum appears in your Start menu and desktop

            ## First open on Mac (one time only)
            1. Download **Momentum-universal.dmg** (or the .zip)
            2. Open the downloaded file
            3. Drag **Momentum** into your **Applications** folder
            4. Open Momentum from Applications

            ## First open (one time only)
            Because the app is free and not sold on the Mac App Store, macOS shows a
            one-time warning. To open it:
            - **Right-click** the Momentum app → click **Open** → click **Open** again, **or**
            - System Settings → Privacy & Security → scroll down → **Open Anyway**

            ## Updates (Mac & Windows)
            The app loads the planner live, so its content updates itself automatically —
            no reinstalling. Your data is stored inside the app's own profile on this Mac.

            ## Notes
            - Universal build: works on both Apple Silicon (M1/M2/M3/M4) and Intel Macs
            - The app is unsigned (no Apple Developer account), so macOS shows the
              one-time warning above — this is normal for free open-source apps
          files: |
            electron/dist/*.zip
            electron/dist/*.dmg
          draft: false
          prerelease: false

  build-windows:
    needs: build-mac
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build dependencies
        working-directory: electron
        run: npm install --no-audit --no-fund

      - name: Build Momentum installer (Windows)
        working-directory: electron
        run: npx electron-builder --publish never

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v2.4.13
          name: Momentum (v2.4.13) — Mac & Windows
          body: |
            **Momentum as a real desktop application — Mac (.app/.dmg) and Windows (.exe installer).**

            ## Mac install
            1. Download **Momentum-2.4.13-universal.dmg** (or the .zip)
            2. Open the downloaded file
            3. Drag **Momentum** into your **Applications** folder
            4. Open Momentum from Applications
            5. First open (one time only): if macOS shows a warning, right-click the app → **Open** → **Open** again, or use System Settings → Privacy & Security → **Open Anyway**

            ## Windows install
            1. Download **Momentum-Setup-2.4.13.exe**
            2. Run it (if Windows SmartScreen shows "Windows protected your PC", click **More info** → **Run anyway** — the app is unsigned because it is free and open-source)
            3. Choose a folder and finish the installer — Momentum appears in your Start menu and desktop

            ## Updates
            The app loads the planner live, so its content updates itself automatically —
            no reinstalling. Your data is stored inside the app's own profile on this computer.

            ## Notes
            - Mac build is universal: works on both Apple Silicon (M1–M4) and Intel Macs
            - Windows build is 64-bit
            - The apps are unsigned, so macOS/Windows show a one-time warning — normal for free open-source apps
          files: |
            electron/dist/*.exe
            electron/dist/*.exe.blockmap
          draft: false
          prerelease: false
