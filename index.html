<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Momentum — an all-in-one productivity planner for tasks, projects, goals and schedules.">
<title>Momentum · Productivity Planner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="stylesheet" href="css/styles.css?v=2.3.5">
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark">⚡</span>
      <span class="brand-name">Momentum</span>
    </div>
    <nav class="sidebar-nav" id="sideNav" aria-label="Main navigation"></nav>
    <div class="sidebar-foot">
      <button class="btn btn-ghost btn-block" id="globalSearchBtn" title="Search everything (Ctrl+K)">🔍 Search…</button>
      <button class="btn btn-ghost btn-block" id="themeToggle" title="Toggle light / dark theme">🌙 <span>Dark mode</span></button>
      <div class="muted small" id="appVersion" style="text-align:center;padding:2px 0 6px"></div>
      <div class="small" id="saveStatus" style="text-align:center;padding:0 0 6px;font-size:11px"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle menu">☰</button>
      <div class="topbar-title" id="topbarTitle">Dashboard</div>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="quickAddBtn">＋ New task</button>
      </div>
    </header>
    <main class="view-host" id="viewHost" tabindex="-1"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite"></div>
<div id="searchOverlay" class="search-overlay hidden" role="dialog" aria-modal="true" aria-label="Global search">
  <div class="search-panel">
    <input id="searchInput" class="search-input" type="search" placeholder="Search tasks, projects, notes…" autocomplete="off">
    <div class="search-hint">Search titles, descriptions, notes &amp; tags · Esc to close</div>
    <div id="searchResults" class="search-results"></div>
  </div>
</div>

<script src="js/utils.js?v=2.3.5"></script>
<script src="js/storage.js?v=2.3.5"></script>
<script src="js/store.js?v=2.3.5"></script>
<script src="js/priority.js?v=2.3.5"></script>
<script src="js/planner.js?v=2.3.5"></script>
<script src="js/timer.js?v=2.3.5"></script>
<script src="js/charts.js?v=2.3.5"></script>
<script src="js/reminders.js?v=2.3.5"></script>
<script src="js/ui.js?v=2.3.5"></script>
<script src="js/views/dashboard.js?v=2.3.5"></script>
<script src="js/views/classes.js?v=2.3.5"></script>
<script src="js/views/activities.js?v=2.3.5"></script>
<script src="js/views/exams.js?v=2.3.5"></script>
<script src="js/views/tasks.js?v=2.3.5"></script>
<script src="js/views/dates.js?v=2.3.5"></script>
<script src="js/views/daily.js?v=2.3.5"></script>
<script src="js/views/monthly.js?v=2.3.5"></script>
<script src="js/views/agenda.js?v=2.3.5"></script>
<script src="js/views/analytics.js?v=2.3.5"></script>
<script src="js/views/settings.js?v=2.3.5"></script>
<script src="js/app.js?v=2.3.5"></script>
</body>
</html>
